<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            /* Points to your uploaded Santorini background image */
            background: url('Santorini_1.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            transition: background 0.4s ease, color 0.4s ease;
        }
        h1 { 
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            display: inline-block;
            animation: bounce 1.5s infinite alternate;
        }
        p {
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
        .card {
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent white box for readability */
            color: #333;
            padding: 20px;
            margin: 20px auto;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <h1>Hello, World! 🇬🇷🏛️</h1>
    <p>Welcome to my live website!</p>

    <!-- Theme Toggle Button -->
    <div style="margin: 20px;">
        <button onclick="toggleTheme()" style="padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold;">
            Toggle Dark Mode 🌙
        </button>
    </div>

    <!-- Click Counter Interactive Card -->
    <div class="card">
        <h3>Interactive Card</h3>
        <button id="funBtn" onclick="countClicks()" style="padding: 10px 18px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Click me! 🚀
        </button>
        <p id="counterText" style="margin-top: 10px; color: #666; text-shadow: none;">You have clicked 0 times.</p>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function toggleTheme() {
            if (document.body.style.backgroundColor === 'black') {
                document.body.style.background = "url('Santorini_1.jpg') no-repeat center center fixed";
                document.body.style.backgroundSize = "cover";
                document.body.style.color = '#fff';
            } else {
                document.body.style.background = 'black';
                document.body.style.color = 'white';
            }
        }

        let count = 0;
        function countClicks() {
            count++;
            document.getElementById('counterText').innerText = `You have clicked ${count} times!`;
            if (count === 10) {
                alert("🎉 You unlocked a secret bonus level!");
            }
        }
    </script>

</body>
</html>
